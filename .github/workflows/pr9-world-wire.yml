name: PR9 world wiring

on:
  push:
    branches:
      - work/vertical-slice-world-production

permissions:
  contents: write

jobs:
  wire-format-verify:
    if: ${{ !contains(github.event.head_commit.message, '[pr9-world-wired]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/vertical-slice-world-production
          fetch-depth: 0
      - name: Wire route gates archetypes mechanisms and input
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected pattern in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          game = 'Source/LostsenseGame/Private/LostsenseGameMode.cpp'
          replace(game,
                  '#include "LostsenseKnightCharacter.h"\n#include "LostsenseNpcActor.h"',
                  '#include "LostsenseKnightCharacter.h"\n#include "LostsenseMechanismActor.h"\n#include "LostsenseNpcActor.h"')
          replace(game,
                  '#include "LostsensePlayerController.h"',
                  '#include "LostsensePlayerController.h"\n#include "LostsenseStoryGateActor.h"')
          replace(game,
                  'void SpawnEnemy(UWorld &World, UStaticMesh *Cylinder, const FVector &Location,\n                const uint64 CombatantId, const bool bElite,\n                const uint32 ItemLevel) {',
                  'void SpawnEnemy(UWorld &World, UStaticMesh *Cylinder, const FVector &Location,\n                const uint64 CombatantId,\n                const ELostsenseEnemyArchetype Archetype,\n                const uint32 ItemLevel) {')
          replace(game,
                  '  Enemy->ConfigureEnemy(CombatantId, bElite, ItemLevel);',
                  '  Enemy->ConfigureEnemyArchetype(CombatantId, Archetype, ItemLevel);')
          replace(game,
                  '    AttachMarker(World, *Enemy, *Cylinder,\n                 bElite ? FVector(0.72F, 0.72F, 1.15F)\n                        : FVector(0.55F, 0.55F, 0.95F));',
                  '    const bool bLarge = Archetype == ELostsenseEnemyArchetype::ForemanKett ||\n                        Archetype == ELostsenseEnemyArchetype::HaulConstruct;\n    AttachMarker(World, *Enemy, *Cylinder,\n                 bLarge ? FVector(0.72F, 0.72F, 1.15F)\n                        : FVector(0.55F, 0.55F, 0.95F));')

          helper_anchor = 'void SpawnBellgrave(UWorld &World, const FSliceMeshes &Meshes) {'
          helpers = r'''void SpawnStoryGate(UWorld &World, const FVector &Location,
                    const ELostsenseStoryBeat Beat,
                    const ELostsenseStoryBeat RequiredBeat) {
  const FTransform Transform(FRotator::ZeroRotator, Location);
  ALostsenseStoryGateActor *Gate =
      World.SpawnActorDeferred<ALostsenseStoryGateActor>(
          ALostsenseStoryGateActor::StaticClass(), Transform, nullptr, nullptr,
          ESpawnActorCollisionHandlingMethod::AlwaysSpawn);
  if (Gate == nullptr) {
    return;
  }
  Gate->Configure(Beat, RequiredBeat, true);
  UGameplayStatics::FinishSpawningActor(Gate, Transform);
}

void SpawnMechanism(UWorld &World, const FVector &Location,
                    const FVector &Scale,
                    const ELostsenseMechanismKind Kind,
                    const bool bInitiallyRaised = true) {
  const FTransform Transform(FRotator::ZeroRotator, Location, Scale);
  ALostsenseMechanismActor *Mechanism =
      World.SpawnActorDeferred<ALostsenseMechanismActor>(
          ALostsenseMechanismActor::StaticClass(), Transform, nullptr, nullptr,
          ESpawnActorCollisionHandlingMethod::AlwaysSpawn);
  if (Mechanism == nullptr) {
    return;
  }
  Mechanism->Configure(Kind, bInitiallyRaised);
  UGameplayStatics::FinishSpawningActor(Mechanism, Transform);
}

'''
          replace(game, helper_anchor, helpers + helper_anchor)

          replace(game,
                  '  SpawnNpc(World, Meshes.Cylinder, ELostsenseNpcIdentity::TamsinCoil,\n           FVector(-950.0F, 700.0F, 110.0F));\n}',
                  '  SpawnNpc(World, Meshes.Cylinder, ELostsenseNpcIdentity::TamsinCoil,\n           FVector(-950.0F, 700.0F, 110.0F));\n  SpawnEnemy(World, Meshes.Cylinder, FVector(1050.0F, -250.0F, 110.0F),\n             1000U, ELostsenseEnemyArchetype::CharterDeserter, 2U);\n  SpawnStoryGate(World, FVector(4950.0F, 0.0F, 180.0F),\n                 ELostsenseStoryBeat::EnteredRavelwood,\n                 ELostsenseStoryBeat::BellgraveDepartureAllowed);\n}')

          replace(game,
                  'SpawnEnemy(World, Meshes.Cylinder, FVector(5600.0F, -450.0F, 180.0F), 1101U,\n             false, 3U);',
                  'SpawnEnemy(World, Meshes.Cylinder, FVector(5600.0F, -450.0F, 180.0F), 1101U,\n             ELostsenseEnemyArchetype::BellMaddenedCarrion, 3U);')
          replace(game,
                  'SpawnEnemy(World, Meshes.Cylinder, FVector(6300.0F, 420.0F, 210.0F), 1102U,\n             false, 3U);',
                  'SpawnEnemy(World, Meshes.Cylinder, FVector(6300.0F, 420.0F, 210.0F), 1102U,\n             ELostsenseEnemyArchetype::CharterDeserter, 3U);')
          replace(game,
                  'SpawnEnemy(World, Meshes.Cylinder, FVector(8500.0F, 0.0F, -220.0F), 1201U,\n             false, 4U);\n}',
                  'SpawnEnemy(World, Meshes.Cylinder, FVector(8500.0F, 0.0F, -220.0F), 1201U,\n             ELostsenseEnemyArchetype::EchoMiner, 4U);\n  SpawnMechanism(World, FVector(9050.0F, 180.0F, -560.0F),\n                 FVector(1.2F, 1.2F, 0.18F),\n                 ELostsenseMechanismKind::NinthDescentPlate);\n  SpawnStoryGate(World, FVector(10000.0F, 0.0F, -620.0F),\n                 ELostsenseStoryBeat::EnteredUpperVaur,\n                 ELostsenseStoryBeat::FoundNinthDescentPlate);\n}')

          replace(game,
                  'SpawnEnemy(World, Meshes.Cylinder, FVector(10400.0F, -250.0F, -650.0F), 1301U,\n             false, 5U);',
                  'SpawnEnemy(World, Meshes.Cylinder, FVector(10400.0F, -250.0F, -650.0F), 1301U,\n             ELostsenseEnemyArchetype::EchoMiner, 5U);')
          replace(game,
                  'SpawnEnemy(World, Meshes.Cylinder, FVector(11100.0F, 350.0F, -1100.0F), 1302U,\n             false, 5U);',
                  'SpawnEnemy(World, Meshes.Cylinder, FVector(11100.0F, 350.0F, -1100.0F), 1302U,\n             ELostsenseEnemyArchetype::HaulConstruct, 5U);')
          replace(game,
                  '  const float ShaftX = 14500.0F;',
                  '  const float ShaftX = 14500.0F;\n  SpawnStoryGate(World, FVector(ShaftX - 250.0F, 0.0F, -2100.0F),\n                 ELostsenseStoryBeat::EnteredCoinlessShaft,\n                 ELostsenseStoryBeat::EnteredUpperVaur);')
          replace(game,
                  'SpawnEnemy(World, Meshes.Cylinder, FVector(ShaftX + 3600.0F, 0.0F, -2700.0F),\n             1401U, true, 7U);',
                  'SpawnMechanism(World, FVector(ShaftX + 2550.0F, -650.0F, -2350.0F),\n                 FVector(1.1F, 1.1F, 3.0F),\n                 ELostsenseMechanismKind::Counterweight, true);\n  SpawnMechanism(World, FVector(ShaftX + 3050.0F, 650.0F, -2450.0F),\n                 FVector(1.1F, 1.1F, 3.0F),\n                 ELostsenseMechanismKind::Counterweight, false);\n  SpawnEnemy(World, Meshes.Cylinder, FVector(ShaftX + 3300.0F, 300.0F, -2700.0F),\n             1402U, ELostsenseEnemyArchetype::HaulConstruct, 7U);\n  SpawnEnemy(World, Meshes.Cylinder, FVector(ShaftX + 3600.0F, 0.0F, -2700.0F),\n             1401U, ELostsenseEnemyArchetype::ForemanKett, 7U);')
          replace(game,
                  '  const FTransform BossTransform(FRotator::ZeroRotator,\n                                 ArenaCenter + FVector(0.0F, 0.0F, 120.0F));',
                  '  SpawnMechanism(World, ArenaCenter + FVector(900.0F, 0.0F, 500.0F),\n                 FVector(0.9F, 0.9F, 3.0F),\n                 ELostsenseMechanismKind::Counterweight, true);\n  SpawnMechanism(World, ArenaCenter + FVector(-900.0F, 0.0F, 500.0F),\n                 FVector(0.9F, 0.9F, 3.0F),\n                 ELostsenseMechanismKind::Counterweight, true);\n  SpawnStoryGate(World, ArenaCenter + FVector(-1100.0F, 0.0F, 100.0F),\n                 ELostsenseStoryBeat::OdranEncounterStarted,\n                 ELostsenseStoryBeat::EnteredCoinlessShaft);\n  SpawnMechanism(World, ArenaCenter + FVector(300.0F, 420.0F, 90.0F),\n                 FVector(0.8F, 0.8F, 0.25F),\n                 ELostsenseMechanismKind::NinthDescentRecord);\n  SpawnMechanism(World, ArenaCenter + FVector(1350.0F, 0.0F, 40.0F),\n                 FVector(2.0F, 2.0F, 0.35F),\n                 ELostsenseMechanismKind::BellCoreRewardLift);\n\n  const FTransform BossTransform(FRotator::ZeroRotator,\n                                 ArenaCenter + FVector(0.0F, 0.0F, 120.0F));')

          knight = 'Source/LostsenseGame/Private/LostsenseKnightCharacter.cpp'
          replace(knight,
                  'GameplayMappingContext->MapKey(ActiveSlot2Action, EKeys::E);',
                  'GameplayMappingContext->MapKey(ActiveSlot2Action, EKeys::Two);')

          enemy = 'Source/LostsenseGame/Private/LostsenseEnemyCharacter.cpp'
          replace(enemy,
                  '  if (bBoss) {\n    UGameInstance *GameInstance = GetGameInstance();\n    ULostsenseStorySubsystem *Story =\n        GameInstance != nullptr\n            ? GameInstance->GetSubsystem<ULostsenseStorySubsystem>()\n            : nullptr;\n    if (Story != nullptr) {\n      static_cast<void>(Story->CompleteBeat(ELostsenseStoryBeat::OdranDefeated));\n    }\n  }',
                  '  UGameInstance *GameInstance = GetGameInstance();\n  ULostsenseStorySubsystem *Story =\n      GameInstance != nullptr\n          ? GameInstance->GetSubsystem<ULostsenseStorySubsystem>()\n          : nullptr;\n  if (Story != nullptr) {\n    if (bBoss) {\n      static_cast<void>(\n          Story->CompleteBeat(ELostsenseStoryBeat::OdranDefeated));\n    } else if (PortableEnemy->Combatant.Id().Value == 1000U) {\n      static_cast<void>(Story->CompleteBeat(\n          ELostsenseStoryBeat::BellgraveDepartureAllowed));\n    }\n  }')

          mechanism = 'Source/LostsenseGame/Private/LostsenseMechanismActor.cpp'
          replace(mechanism,
                  '  if (Kind != ELostsenseMechanismKind::BellCoreRewardLift) {\n    return true;\n  }',
                  '  if (Kind != ELostsenseMechanismKind::BellCoreRewardLift &&\n      Kind != ELostsenseMechanismKind::NinthDescentRecord) {\n    return true;\n  }')
          replace(mechanism,
                  '  return Story != nullptr && Story->HasBeat(ELostsenseStoryBeat::OdranDefeated) &&\n         Story->HasBeat(ELostsenseStoryBeat::NinthDescentRecordRecovered);',
                  '  if (Story == nullptr ||\n      !Story->HasBeat(ELostsenseStoryBeat::OdranDefeated)) {\n    return false;\n  }\n  return Kind == ELostsenseMechanismKind::NinthDescentRecord ||\n         Story->HasBeat(ELostsenseStoryBeat::NinthDescentRecordRecovered);')
          PY
      - name: Format and verify
        run: |
          mapfile -t files < <(find Source Tests -type f \( -name '*.cpp' -o -name '*.h' \) -print | sort)
          clang-format -i "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"
          python3 Scripts/Verify-UnrealStatic.py
      - name: Build and test portable runtime
        env:
          CXX: g++
        run: |
          cmake -S . -B build-pr9 -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOSTSENSE_WARNINGS_AS_ERRORS=ON
          cmake --build build-pr9 --parallel
          ctest --test-dir build-pr9 --output-on-failure
      - name: Commit clean wired product
        run: |
          rm -rf build-pr9
          git rm .github/workflows/pr9-world-wire.yml
          git add Source Tests Scripts CMakeLists.txt
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Wire first-slice world progression [pr9-world-wired]"
          git push origin HEAD:work/vertical-slice-world-production
