name: PR12 format repair

"on":
  push:
    branches: [work/full-game-shell-campaign-ui]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/full-game-shell-campaign-ui
      - name: Format changed C++ surface
        run: |
          clang-format -i             Source/Lostsense/Gameplay/Story/CampaignCatalog.h             Source/Lostsense/Gameplay/Story/CampaignCatalog.cpp             Tests/Gameplay/CampaignCatalogTests.cpp             Source/LostsenseGame/Public/LostsenseGameUserSettings.h             Source/LostsenseGame/Private/LostsenseGameUserSettings.cpp             Source/LostsenseGame/Public/LostsensePlayerController.h             Source/LostsenseGame/Private/LostsensePlayerController.cpp             Source/LostsenseGame/Private/LostsenseDevelopmentHUD.cpp
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source Tests
          git commit -m "Apply PR12 clang-format"
          git push origin HEAD:work/full-game-shell-campaign-ui
