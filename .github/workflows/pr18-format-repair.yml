name: PR18 format repair
"on":
  push:
    branches: [work/act6-hollow-meridian]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/act6-hollow-meridian
      - name: Format Act VI C++ surface
        run: |
          clang-format -i             Source/LostsenseGame/Public/LostsenseEnemyCharacter.h             Source/LostsenseGame/Private/LostsenseEnemyCharacter.cpp             Source/Lostsense/Gameplay/Content/FirstSliceContent.h             Source/Lostsense/Gameplay/Content/FirstSliceContent.cpp             Source/LostsenseGame/Public/LostsenseActSixStoryActor.h             Source/LostsenseGame/Private/LostsenseActSixStoryActor.cpp             Source/LostsenseGame/Public/LostsenseActSixWorldSubsystem.h             Source/LostsenseGame/Private/LostsenseActSixWorldSubsystem.cpp
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source
          git commit -m "Apply PR18 clang-format"
          git push origin HEAD:work/act6-hollow-meridian
