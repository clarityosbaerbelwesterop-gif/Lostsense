name: PR7 runner formatting

on:
  push:
    branches:
      - codex/pr7-format-runner

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Format changed C++ with runner clang-format
        shell: bash
        run: |
          set -euo pipefail
          clang-format --version
          clang-format -i \
            Source/Lostsense/Gameplay/Content/FirstSliceContent.cpp \
            Tests/Gameplay/FirstSliceContentTests.cpp \
            Tests/Gameplay/GameplayEventTests.cpp
          git diff --check
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Source/Lostsense/Gameplay/Content/FirstSliceContent.cpp \
            Tests/Gameplay/FirstSliceContentTests.cpp \
            Tests/Gameplay/GameplayEventTests.cpp
          git commit -m "Format PR7 gameplay content"
          git push origin HEAD:codex/pr7-format-runner
