name: PR9 clean format

"on":
  push:
    branches: [work/vertical-slice-world-production]

permissions:
  contents: write

jobs:
  clean-format:
    if: ${{ !contains(github.event.head_commit.message, '[pr9-clean]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/vertical-slice-world-production
          fetch-depth: 0
      - name: Repair audited integration details
        run: |
          sed -i 's/MapKey(ActiveSlot2Action, EKeys::E)/MapKey(ActiveSlot2Action, EKeys::Two)/' Source/LostsenseGame/Private/LostsenseKnightCharacter.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Source/LostsenseGame/Private/LostsenseEnemyCharacter.cpp')
          s = p.read_text()
          old = "  if (bBoss) {\n    UGameInstance *GameInstance = GetGameInstance();\n    ULostsenseStorySubsystem *Story =\n        GameInstance != nullptr\n            ? GameInstance->GetSubsystem<ULostsenseStorySubsystem>()\n            : nullptr;\n    if (Story != nullptr) {\n      static_cast<void>(\n          Story->CompleteBeat(ELostsenseStoryBeat::OdranDefeated));\n    }\n  }"
          new = "  UGameInstance *GameInstance = GetGameInstance();\n  ULostsenseStorySubsystem *Story =\n      GameInstance != nullptr\n          ? GameInstance->GetSubsystem<ULostsenseStorySubsystem>()\n          : nullptr;\n  if (Story != nullptr) {\n    if (bBoss) {\n      static_cast<void>(\n          Story->CompleteBeat(ELostsenseStoryBeat::OdranDefeated));\n    } else if (PortableEnemy->Combatant.Id().Value == 1000U) {\n      static_cast<void>(Story->CompleteBeat(\n          ELostsenseStoryBeat::BellgraveDepartureAllowed));\n    }\n  }"
          if old not in s:
              raise SystemExit('enemy story-tail pattern not found')
          p.write_text(s.replace(old, new))

          p = Path('Source/LostsenseGame/Private/LostsenseMechanismActor.cpp')
          s = p.read_text()
          old = "  if (Kind != ELostsenseMechanismKind::BellCoreRewardLift) {\n    return true;\n  }"
          new = "  if (Kind != ELostsenseMechanismKind::BellCoreRewardLift &&\n      Kind != ELostsenseMechanismKind::NinthDescentRecord) {\n    return true;\n  }"
          if old not in s:
              raise SystemExit('mechanism gate pattern not found')
          s = s.replace(old, new)
          old = "  return Story != nullptr &&\n         Story->HasBeat(ELostsenseStoryBeat::OdranDefeated) &&\n         Story->HasBeat(ELostsenseStoryBeat::NinthDescentRecordRecovered);"
          new = "  if (Story == nullptr ||\n      !Story->HasBeat(ELostsenseStoryBeat::OdranDefeated)) {\n    return false;\n  }\n  return Kind == ELostsenseMechanismKind::NinthDescentRecord ||\n         Story->HasBeat(ELostsenseStoryBeat::NinthDescentRecordRecovered);"
          if old not in s:
              raise SystemExit('mechanism reward pattern not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Format and static verify
        run: |
          mapfile -t files < <(find Source Tests -type f \( -name '*.cpp' -o -name '*.h' \) -print | sort)
          clang-format -i "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"
          python3 Scripts/Verify-UnrealStatic.py
      - name: GCC portable gate
        env:
          CXX: g++
        run: |
          cmake -S . -B build-pr9 -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOSTSENSE_WARNINGS_AS_ERRORS=ON
          cmake --build build-pr9 --parallel
          ctest --test-dir build-pr9 --output-on-failure
      - name: Commit clean product
        run: |
          rm -rf build-pr9
          git rm .github/workflows/pr9-clean-format.yml
          git add Source Tests Scripts CMakeLists.txt
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Harden first-slice integration [pr9-clean]"
          git push origin HEAD:work/vertical-slice-world-production
