name: PR9 format finalizer

on:
  push:
    branches:
      - work/vertical-slice-world-production

permissions:
  contents: write

jobs:
  format-and-clean:
    if: ${{ !contains(github.event.head_commit.message, '[pr9-format-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/vertical-slice-world-production
          fetch-depth: 0
      - name: Update Unreal production entrypoint gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Scripts/Verify-UnrealStatic.py')
          text = path.read_text()
          text = text.replace('"SpawnDevelopmentArena()"', '"SpawnVerticalSliceWorld()"')
          path.write_text(text)
          PY
      - name: Format C++ sources and tests
        run: |
          mapfile -t files < <(find Source Tests -type f \( -name '*.cpp' -o -name '*.h' \) -print | sort)
          clang-format -i "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"
      - name: Verify portable build before commit
        env:
          CXX: g++
        run: |
          cmake -S . -B build-pr9 -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOSTSENSE_WARNINGS_AS_ERRORS=ON
          cmake --build build-pr9 --parallel
          ctest --test-dir build-pr9 --output-on-failure
          python3 Scripts/Verify-UnrealStatic.py
      - name: Commit formatted product and remove helper
        run: |
          rm -rf build-pr9
          git rm .github/workflows/pr9-format-finalize.yml
          git add Source Tests Scripts/Verify-UnrealStatic.py CMakeLists.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Finalize PR9 source formatting [pr9-format-done]"
          git push origin HEAD:work/vertical-slice-world-production
