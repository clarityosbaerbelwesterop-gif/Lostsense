name: PR8 Unreal shell finalize

on:
  push:
    branches:
      - codex/unreal-playable-combat-shell

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format Unreal adapter source
        run: |
          find Source/LostsenseGame -type f \( -name '*.h' -o -name '*.cpp' \) -print0 | xargs -0 clang-format -i

      - name: Verify portable build and tests
        run: |
          cmake -S . -B build-pr8-finalize -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOSTSENSE_WARNINGS_AS_ERRORS=ON
          cmake --build build-pr8-finalize --parallel 2
          ctest --test-dir build-pr8-finalize --output-on-failure

      - name: Commit clean product tree
        run: |
          rm -f .github/workflows/pr8-unreal-shell-finalize.yml
          git add -A Source/LostsenseGame .github/workflows/pr8-unreal-shell-finalize.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize Odran HUD and development encounter shell'
          git push
