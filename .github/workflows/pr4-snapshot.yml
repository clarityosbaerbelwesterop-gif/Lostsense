name: PR4 Source Snapshot

"on":
  push:
    branches: [codex/skill-graph-build-runtime]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: lostsense-pr4-source
          if-no-files-found: error
          path: |
            .clang-format
            .gitignore
            CMakeLists.txt
            README.md
            Source
            Tests
            .github/workflows/ci.yml
