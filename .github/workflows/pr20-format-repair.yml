name: PR20 format repair
"on":
  push:
    branches: [work/act8-red-archive]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/act8-red-archive
      - run: clang-format -i Source/LostsenseGame/Public/LostsenseEnemyCharacter.h Source/LostsenseGame/Private/LostsenseEnemyCharacter.cpp Source/LostsenseGame/Public/LostsenseActEightStoryActor.h Source/LostsenseGame/Private/LostsenseActEightStoryActor.cpp Source/LostsenseGame/Public/LostsenseActEightWorldSubsystem.h Source/LostsenseGame/Private/LostsenseActEightWorldSubsystem.cpp
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source && git commit -m "Apply PR20 clang-format" && git push origin HEAD:work/act8-red-archive
