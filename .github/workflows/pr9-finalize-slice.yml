name: PR9 slice finalizer

"on":
  push:
    branches: [work/vertical-slice-world-production]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[pr9-slice-finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/vertical-slice-world-production
          fetch-depth: 0
      - name: Apply audited slice fixes
        run: |
          sed -i 's/MapKey(ActiveSlot2Action, EKeys::E)/MapKey(ActiveSlot2Action, EKeys::Two)/' Source/LostsenseGame/Private/LostsenseKnightCharacter.cpp
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Source/LostsenseGame/Private/LostsenseEnemyCharacter.cpp')
          s = p.read_text()
          old = "  if (bBoss) {\n    UGameInstance *GameInstance = GetGameInstance();\n    ULostsenseStorySubsystem *Story =\n        GameInstance != nullptr\n            ? GameInstance->GetSubsystem<ULostsenseStorySubsystem>()\n            : nullptr;\n    if (Story != nullptr) {\n      static_cast<void>(\n          Story->CompleteBeat(ELostsenseStoryBeat::OdranDefeated));\n    }\n  }"
          new = "  UGameInstance *GameInstance = GetGameInstance();\n  ULostsenseStorySubsystem *Story =\n      GameInstance != nullptr\n          ? GameInstance->GetSubsystem<ULostsenseStorySubsystem>()\n          : nullptr;\n  if (Story != nullptr) {\n    if (bBoss) {\n      static_cast<void>(\n          Story->CompleteBeat(ELostsenseStoryBeat::OdranDefeated));\n    } else if (PortableEnemy->Combatant.Id().Value == 1000U) {\n      static_cast<void>(Story->CompleteBeat(\n          ELostsenseStoryBeat::BellgraveDepartureAllowed));\n    }\n  }"
          if old not in s:
              raise SystemExit('enemy defeat story pattern missing')
          p.write_text(s.replace(old, new))

          p = Path('Source/LostsenseGame/Private/LostsenseMechanismActor.cpp')
          s = p.read_text()
          old = "  if (Kind == ELostsenseMechanismKind::Counterweight) {\n    bRaised = !bRaised;\n    ApplyCounterweightState();\n    return true;\n  }"
          new = old + "\n\n  if (Kind == ELostsenseMechanismKind::BellCoreRewardLift) {\n    SetActorLocation(GetActorLocation() + FVector(0.0F, 0.0F, 420.0F));\n    bConsumed = true;\n    return true;\n  }"
          if old not in s:
              raise SystemExit('mechanism interaction pattern missing')
          s = s.replace(old, new)
          s = s.replace("  case ELostsenseMechanismKind::BellCoreRewardLift:\n    bAdvanced = Story->CompleteBeat(ELostsenseStoryBeat::BellgraveChanged);\n    break;", "  case ELostsenseMechanismKind::BellCoreRewardLift:\n    break;")
          p.write_text(s)

          p = Path('Source/LostsenseGame/Private/LostsenseGameMode.cpp')
          s = p.read_text()
          anchor = "  SpawnStoryGate(World, FVector(4950.0F, 0.0F, 180.0F),\n                 ELostsenseStoryBeat::EnteredRavelwood,\n                 ELostsenseStoryBeat::BellgraveDepartureAllowed);"
          inserted = "  SpawnStoryGate(World, FVector(1800.0F, 0.0F, 140.0F),\n                 ELostsenseStoryBeat::BellgraveChanged,\n                 ELostsenseStoryBeat::NinthDescentRecordRecovered);\n" + anchor
          if anchor not in s:
              raise SystemExit('Bellgrave route gate pattern missing')
          p.write_text(s.replace(anchor, inserted))
          PY
      - name: Format and verify source tree
        run: |
          mapfile -t files < <(find Source Tests -type f \( -name '*.cpp' -o -name '*.h' \) -print | sort)
          clang-format -i "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"
          python3 Scripts/Verify-UnrealStatic.py
          git diff --check
      - name: GCC portable regression suite
        env:
          CXX: g++
        run: |
          cmake -S . -B build-pr9 -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOSTSENSE_WARNINGS_AS_ERRORS=ON
          cmake --build build-pr9 --parallel
          ctest --test-dir build-pr9 --output-on-failure
      - name: Commit durable clean product
        run: |
          rm -rf build-pr9
          git rm .github/workflows/pr9-finalize-slice.yml
          git add Source Tests Scripts CMakeLists.txt
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Finalize Bellgrave-to-Odran slice integration [pr9-slice-finalized]"
          git push origin HEAD:work/vertical-slice-world-production
