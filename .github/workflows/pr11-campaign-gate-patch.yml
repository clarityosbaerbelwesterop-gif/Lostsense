name: PR11 campaign gate repair

"on":
  push:
    branches: [work/act2-ravelwood-production]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/act2-ravelwood-production
      - name: Enforce Act IV clearance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('Source/Lostsense/Gameplay/World/DeepRouteState.cpp')
          s=p.read_text()
          s=s.replace('''  case DeepRouteMilestone::VentilationNaveStabilized:\n    if (VentilationIntake_ != DeepMechanismState::Open ||\n        ReliefVent_ != DeepMechanismState::Open) {\n      return false;\n    }\n    break;\n  case DeepRouteMilestone::PumpCathedralApproachOpened:\n    break;\n''','''  case DeepRouteMilestone::VentilationNaveStabilized:\n    if (VentilationIntake_ != DeepMechanismState::Open ||\n        ReliefVent_ != DeepMechanismState::Open) {\n      return false;\n    }\n    break;\n  case DeepRouteMilestone::ActFourClearanceGranted:\n  case DeepRouteMilestone::PumpCathedralApproachOpened:\n    break;\n''',1)
          s=s.replace('''  case DeepRouteMilestone::VentilationNaveStabilized:\n    ReturnShortcut_ = DeepMechanismState::Available;\n    break;\n  case DeepRouteMilestone::PumpCathedralApproachOpened:\n    break;\n''','''  case DeepRouteMilestone::VentilationNaveStabilized:\n    ReturnShortcut_ = DeepMechanismState::Available;\n    break;\n  case DeepRouteMilestone::ActFourClearanceGranted:\n  case DeepRouteMilestone::PumpCathedralApproachOpened:\n    break;\n''',1)
          p.write_text(s)

          p=Path('Source/LostsenseGame/Public/LostsenseStorySubsystem.h')
          s=p.read_text().replace('''  VentilationNaveStabilized,\n  PumpCathedralApproachOpened\n''','''  VentilationNaveStabilized,\n  ActFourClearanceGranted,\n  PumpCathedralApproachOpened\n''',1)
          p.write_text(s)

          p=Path('Source/LostsenseGame/Private/LostsenseDeepMechanismActor.cpp')
          s=p.read_text().replace('''    return Story->HasDeepRouteMilestone(\n               ELostsenseDeepRouteMilestone::VentilationNaveStabilized) &&\n           !Story->HasDeepRouteMilestone(\n               ELostsenseDeepRouteMilestone::PumpCathedralApproachOpened);\n''','''    return Story->HasDeepRouteMilestone(\n               ELostsenseDeepRouteMilestone::ActFourClearanceGranted) &&\n           !Story->HasDeepRouteMilestone(\n               ELostsenseDeepRouteMilestone::PumpCathedralApproachOpened);\n''',1)
          p.write_text(s)

          p=Path('Tests/Gameplay/DeepRouteStateTests.cpp')
          s=p.read_text().replace('''  test.Expect(route.Complete(DeepRouteMilestone::PumpCathedralApproachOpened),\n              "Pump Cathedral approach can open");\n''','''  test.Expect(!route.Complete(DeepRouteMilestone::PumpCathedralApproachOpened),\n              "Pump Cathedral cannot open before Act IV clearance");\n  test.Expect(route.Complete(DeepRouteMilestone::ActFourClearanceGranted),\n              "future campaign authority can grant Act IV clearance");\n  test.Expect(route.Complete(DeepRouteMilestone::PumpCathedralApproachOpened),\n              "Pump Cathedral approach opens only after campaign clearance");\n''',1)
          p.write_text(s)
          PY
      - name: Format
        run: |
          mapfile -t files < <(find Source Tests -type f \( -name '*.cpp' -o -name '*.h' \) -print | sort)
          clang-format -i "${files[@]}"
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source Tests
          git commit -m "Enforce canonical Act IV clearance gate"
          git push origin HEAD:work/act2-ravelwood-production
