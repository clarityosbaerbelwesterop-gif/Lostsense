name: PR9 multi-target ability

"on":
  push:
    branches: [work/vertical-slice-world-production]

permissions:
  contents: write

jobs:
  implement-verify:
    if: ${{ !contains(github.event.head_commit.message, '[pr9-multitarget]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/vertical-slice-world-production
          fetch-depth: 0
      - name: Implement multi-target runtime and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          p = Path('Source/Lostsense/Gameplay/Abilities/AbilityRuntime.cpp')
          s = p.read_text()
          anchor = 'bool AbilityRuntime::AdvanceTime(const double seconds) noexcept {'
          method = dedent('''
          MultiTargetAbilityActivationOutcome AbilityRuntime::ActivateMany(
              const AbilityId id, const std::vector<AbilityTarget> &targets) {
            MultiTargetAbilityActivationOutcome outcome;
            if (!definitionsValid_) {
              outcome.Primary.Result = AbilityActivationResult::InvalidRuntime;
              return outcome;
            }
            const AbilityDefinition *definition = FindDefinition(id);
            if (definition == nullptr) {
              outcome.Primary.Result = AbilityActivationResult::UnknownAbility;
              return outcome;
            }
            if (targets.empty() || targets.size() > definition->MaximumTargets) {
              outcome.Primary.Result = AbilityActivationResult::InvalidTarget;
              return outcome;
            }

            std::set<std::uint64_t> targetIds;
            for (const AbilityTarget &target : targets) {
              if (!ValidateTarget(*definition, target)) {
                outcome.Primary.Result = AbilityActivationResult::InvalidTarget;
                return outcome;
              }
              if (target.Combatant != nullptr &&
                  !targetIds.insert(target.Combatant->Id().Value).second) {
                outcome.Primary.Result = AbilityActivationResult::InvalidTarget;
                return outcome;
              }
            }

            if (targets.size() == 1U) {
              outcome.Primary = Activate(id, targets.front());
              return outcome;
            }

            struct TargetSnapshot final {
              Combat::Combatant *Combatant{nullptr};
              Combat::CombatantState CombatantState{};
              EffectRuntime *Effects{nullptr};
              EffectRuntimeState EffectState{};
              bool HasCombatantState{false};
              bool HasEffectState{false};
            };

            const Combat::CombatantState ownerState = owner_.CaptureState();
            const EffectRuntimeState ownerEffectState = ownerEffects_.CaptureState();
            const AbilityRuntimeState abilityState = CaptureState();
            const Core::RandomState randomState = random_.CaptureState();
            std::vector<TargetSnapshot> snapshots;
            snapshots.reserve(targets.size());
            for (const AbilityTarget &target : targets) {
              TargetSnapshot snapshot;
              snapshot.Combatant = target.Combatant;
              snapshot.Effects = target.Effects;
              if (target.Combatant != nullptr && target.Combatant != &owner_) {
                snapshot.CombatantState = target.Combatant->CaptureState();
                snapshot.HasCombatantState = true;
              }
              if (target.Effects != nullptr && target.Effects != &ownerEffects_) {
                snapshot.EffectState = target.Effects->CaptureState();
                snapshot.HasEffectState = true;
              }
              snapshots.push_back(std::move(snapshot));
            }

            const auto rollbackAll = [&]() {
              bool ok = true;
              for (auto it = snapshots.rbegin(); it != snapshots.rend(); ++it) {
                if (it->HasEffectState) {
                  ok = it->Effects->RestoreState(it->EffectState) && ok;
                }
              }
              ok = ownerEffects_.RestoreState(ownerEffectState) && ok;
              for (auto it = snapshots.rbegin(); it != snapshots.rend(); ++it) {
                if (it->HasCombatantState) {
                  ok = it->Combatant->RestoreState(it->CombatantState) && ok;
                }
              }
              ok = owner_.RestoreState(ownerState) && ok;
              ok = RestoreState(abilityState) && ok;
              ok = random_.RestoreState(randomState) && ok;
              return ok;
            };

            outcome.Primary = Activate(id, targets.front());
            if (outcome.Primary.Result != AbilityActivationResult::Success) {
              return outcome;
            }

            outcome.AdditionalTargets.reserve(targets.size() - 1U);
            for (std::size_t index = 1U; index < targets.size(); ++index) {
              const AbilityTarget &target = targets[index];
              AbilityActivationOutcome targetOutcome;
              targetOutcome.Result = AbilityActivationResult::Success;
              if (definition->DealsDamage) {
                targetOutcome.Damage =
                    owner_.ResolveAttack(*target.Combatant, definition->Damage, random_);
                targetOutcome.DamageResolved = true;
              }
              for (const EffectId effectId : definition->EffectsOnTarget) {
                if (target.Effects == nullptr) {
                  static_cast<void>(rollbackAll());
                  outcome.Primary.Result = AbilityActivationResult::InternalFailure;
                  outcome.AdditionalTargets.clear();
                  return outcome;
                }
                const EffectApplyOutcome effectResult =
                    target.Effects->Apply(effectId, owner_.Id());
                targetOutcome.EffectResults.push_back(effectResult);
                if (IsFatalEffectResult(effectResult.Result)) {
                  static_cast<void>(rollbackAll());
                  outcome.Primary.Result = AbilityActivationResult::InternalFailure;
                  outcome.AdditionalTargets.clear();
                  return outcome;
                }
              }
              outcome.AdditionalTargets.push_back(std::move(targetOutcome));
            }
            return outcome;
          }

          ''')
          if anchor not in s or 'AbilityRuntime::ActivateMany' in s:
              raise SystemExit('AbilityRuntime insertion anchor invalid')
          s = s.replace(anchor, method + anchor)
          s = s.replace('definition.MaximumCharges > MaximumConfiguredCharges ||\n      !IsFiniteNonNegative(definition.RechargeSeconds)', 'definition.MaximumCharges > MaximumConfiguredCharges ||\n      definition.MaximumTargets == 0U || definition.MaximumTargets > 64U ||\n      !IsFiniteNonNegative(definition.RechargeSeconds)')
          s = s.replace('if (definition.TargetRule == AbilityTargetRule::None &&\n      (definition.DealsDamage || !definition.EffectsOnTarget.empty())) {', 'if ((definition.TargetRule == AbilityTargetRule::None ||\n       definition.TargetRule == AbilityTargetRule::Self) &&\n      definition.MaximumTargets != 1U) {\n    return false;\n  }\n  if (definition.TargetRule == AbilityTargetRule::None &&\n      (definition.DealsDamage || !definition.EffectsOnTarget.empty())) {')
          s = s.replace('return target.Combatant != nullptr && target.Combatant != &owner_ &&\n           target.Relation == TargetRelation::Hostile &&', 'return target.Combatant != nullptr && target.Combatant != &owner_ &&\n           !target.Combatant->Health().IsDead() &&\n           target.Relation == TargetRelation::Hostile &&')
          s = s.replace('return target.Combatant != nullptr &&\n           target.Relation == TargetRelation::Friendly &&', 'return target.Combatant != nullptr &&\n           !target.Combatant->Health().IsDead() &&\n           target.Relation == TargetRelation::Friendly &&')
          p.write_text(s)

          p = Path('Source/Lostsense/Gameplay/Content/FirstSliceContent.cpp')
          s = p.read_text()
          old = '  sweep.Prerequisites = {Bellstep};'
          new = old + '\n  sweep.MaximumTargets = 8U;'
          if old not in s:
              raise SystemExit('March Sweep definition anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('Tests/Gameplay/AbilityRuntimeTests.cpp')
          s = p.read_text()
          anchor = '} // namespace\n\nint main() {'
          test = dedent('''
          void TestMultiTargetActivationIsAtomicAndSingleCost(TestSuite &suite) {
            Fixture fixture;
            Combat::Combatant secondTarget{Combat::CombatantId{201U},
                                           Combat::CombatantKind::Enemy};
            EffectRuntime secondEffects{secondTarget, EffectDefinitions()};

            AbilityDefinition sweep;
            sweep.Id = {50U};
            sweep.ResourceCost = 10.0;
            sweep.CooldownSeconds = 1.0;
            sweep.TargetRule = AbilityTargetRule::Hostile;
            sweep.MaximumTargets = 3U;
            sweep.Damage = PhysicalDamage(12.0);
            sweep.DealsDamage = true;
            sweep.EffectsOnTarget = {Burning};

            Core::DeterministicRandom random{99U, 3U};
            AbilityRuntime runtime{fixture.Owner, fixture.OwnerEffects, random, Knight,
                                   {sweep}};
            suite.Expect(runtime.IsValid() && runtime.Unlock(sweep.Id),
                         "multi-target ability definition unlocks");

            const double resourceBefore = fixture.Owner.Resource().Current();
            const std::vector<AbilityTarget> targets = {
                {&fixture.Target, &fixture.TargetEffects, TargetRelation::Hostile},
                {&secondTarget, &secondEffects, TargetRelation::Hostile}};
            const auto result = runtime.ActivateMany(sweep.Id, targets);
            suite.Expect(result.Primary.Result == AbilityActivationResult::Success &&
                             result.AdditionalTargets.size() == 1U,
                         "multi-target activation resolves every authoritative target");
            suite.ExpectNear(fixture.Owner.Resource().Current(), resourceBefore - 10.0,
                             "multi-target activation spends resource once");
            suite.ExpectNear(fixture.Target.Health().Current(), 88.0,
                             "primary target receives sweep damage");
            suite.ExpectNear(secondTarget.Health().Current(), 88.0,
                             "secondary target receives sweep damage");
            suite.Expect(fixture.TargetEffects.HasEffect(Burning) &&
                             secondEffects.HasEffect(Burning),
                         "target effects apply to each multi-target victim");
            suite.Expect(runtime.ActivateMany(sweep.Id, targets).Primary.Result ==
                             AbilityActivationResult::OnCooldown,
                         "multi-target activation starts only one cooldown");

            AbilityDefinition atomicSweep = sweep;
            atomicSweep.Id = {51U};
            atomicSweep.CooldownSeconds = 0.0;
            Core::DeterministicRandom rollbackRandom{100U, 3U};
            AbilityRuntime rollbackRuntime{fixture.Owner, fixture.OwnerEffects,
                                           rollbackRandom, Knight, {atomicSweep}};
            suite.Expect(rollbackRuntime.Unlock(atomicSweep.Id),
                         "atomic multi-target test ability unlocks");
            EffectDefinition onlyStun;
            onlyStun.Id = Stun;
            onlyStun.StackGroup = {2U};
            onlyStun.Stacking = EffectStackingPolicy::RefreshDuration;
            onlyStun.DurationSeconds = 2.0;
            EffectRuntime incompatibleSecond{secondTarget, {onlyStun}};
            const auto ownerBefore = fixture.Owner.CaptureState();
            const auto firstBefore = fixture.Target.CaptureState();
            const auto secondBefore = secondTarget.CaptureState();
            const auto randomBefore = rollbackRandom.CaptureState();
            const std::vector<AbilityTarget> failingTargets = {
                {&fixture.Target, &fixture.TargetEffects, TargetRelation::Hostile},
                {&secondTarget, &incompatibleSecond, TargetRelation::Hostile}};
            const auto failed =
                rollbackRuntime.ActivateMany(atomicSweep.Id, failingTargets);
            suite.Expect(failed.Primary.Result ==
                             AbilityActivationResult::InternalFailure,
                         "late multi-target effect failure aborts activation");
            suite.ExpectNear(fixture.Owner.Resource().Current(),
                             ownerBefore.Resource.Current,
                             "multi-target failure rolls back single resource cost");
            suite.ExpectNear(fixture.Target.Health().Current(),
                             firstBefore.Health.Current,
                             "multi-target failure rolls back primary damage");
            suite.ExpectNear(secondTarget.Health().Current(),
                             secondBefore.Health.Current,
                             "multi-target failure rolls back secondary damage");
            suite.Expect(rollbackRandom.CaptureState() == randomBefore,
                         "multi-target failure restores authoritative RNG");

            static_cast<void>(secondTarget.ApplyDamage(1000.0));
            suite.Expect(runtime.AdvanceTime(1.0), "sweep cooldown clears");
            const double firstHealthBeforeDeadTarget = fixture.Target.Health().Current();
            suite.Expect(runtime.ActivateMany(sweep.Id, targets).Primary.Result ==
                             AbilityActivationResult::InvalidTarget,
                         "dead secondary target rejects entire sweep before mutation");
            suite.ExpectNear(fixture.Target.Health().Current(),
                             firstHealthBeforeDeadTarget,
                             "dead-target rejection prevents partial sweep damage");

            const std::vector<AbilityTarget> duplicateTargets = {
                {&fixture.Target, &fixture.TargetEffects, TargetRelation::Hostile},
                {&fixture.Target, &fixture.TargetEffects, TargetRelation::Hostile}};
            suite.Expect(runtime.ActivateMany(sweep.Id, duplicateTargets)
                                 .Primary.Result ==
                             AbilityActivationResult::InvalidTarget,
                         "duplicate target cannot receive duplicate hit from one sweep");
          }

          ''')
          if anchor not in s:
              raise SystemExit('ability test insertion anchor missing')
          s = s.replace(anchor, test + anchor)
          s = s.replace('  TestRechargeAndRestoreBoundaries(suite);', '  TestRechargeAndRestoreBoundaries(suite);\n  TestMultiTargetActivationIsAtomicAndSingleCost(suite);')
          p.write_text(s)
          PY
      - name: Format and verify portable runtime
        run: |
          mapfile -t files < <(find Source Tests -type f \( -name '*.cpp' -o -name '*.h' \) -print | sort)
          clang-format -i "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"
          git diff --check
          python3 Scripts/Verify-UnrealStatic.py
      - name: GCC and CTest
        env:
          CXX: g++
        run: |
          cmake -S . -B build-multi -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOSTSENSE_WARNINGS_AS_ERRORS=ON
          cmake --build build-multi --parallel
          ctest --test-dir build-multi --output-on-failure
      - name: Commit clean multi-target implementation
        run: |
          rm -rf build-multi
          git rm .github/workflows/pr9-multitarget.yml
          git add Source Tests
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add atomic multi-target ability semantics [pr9-multitarget]"
          git push origin HEAD:work/vertical-slice-world-production
