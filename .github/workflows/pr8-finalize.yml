name: PR8 finalize product tree

on:
  push:
    branches:
      - codex/unreal-playable-combat-shell

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/pr8-payload-00 .tmp/pr8-payload-01 > /tmp/pr8-payload.b64
          base64 -d /tmp/pr8-payload.b64 > /tmp/pr8-payload.tar.gz
          echo "dda5457df9a5a58ddb5ed7de4b6cd0355441f4c9c0a0b6071885ccc4e66600f0  /tmp/pr8-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pr8-payload.tar.gz -C .

      - name: Format source with repository runner
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find Source Tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | sort -z)
          clang-format -i "${files[@]}"
          git diff --check

      - name: Verify portable build and tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-pr8 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLOSTSENSE_WARNINGS_AS_ERRORS=ON
          cmake --build build-pr8 --parallel 2
          ctest --test-dir build-pr8 --output-on-failure

      - name: Commit clean product tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          rm -f .github/workflows/pr8-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Build Unreal playable combat shell"
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -E '^(\.tmp/|\.github/workflows/pr8-finalize\.yml)$'; then
            echo "Temporary finalization artifact leaked into product diff" >&2
            exit 1
          fi
          git push origin HEAD:codex/unreal-playable-combat-shell
