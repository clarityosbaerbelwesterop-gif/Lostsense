name: PR10 deep enemy integration

"on":
  push:
    branches: [work/deep-vaur-production]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deep-vaur-production
      - name: Integrate authored deep enemy roles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Source/LostsenseGame/Private/LostsenseEnemyCharacter.cpp')
          s = p.read_text()
          old = '''  case ELostsenseEnemyArchetype::ForemanKett:\n    return {155.0, 11.0,   8.0,   1400.0, 195.0, 12.0,\n            0.95,  220.0F, 0.72F, 0.85F,  1.15F};\n  case ELostsenseEnemyArchetype::Odran:\n'''
          new = '''  case ELostsenseEnemyArchetype::ForemanKett:\n    return {155.0, 11.0,   8.0,   1400.0, 195.0, 12.0,\n            0.95,  220.0F, 0.72F, 0.85F,  1.15F};\n  case ELostsenseEnemyArchetype::GildedDead:\n    return {118.0, 10.0,   15.0,  1180.0, 205.0, 14.0,\n            0.90,  155.0F, 1.05F, 1.20F,  1.55F};\n  case ELostsenseEnemyArchetype::PressureMutant:\n    return {96.0, 12.0,   4.0,   1320.0, 235.0, 10.0,\n            1.05,  255.0F, 0.62F, 1.05F,  1.10F};\n  case ELostsenseEnemyArchetype::RailMarshal:\n    return {172.0, 13.0,   10.0,  1550.0, 230.0, 15.0,\n            1.00,  275.0F, 0.48F, 0.70F,  0.92F};\n  case ELostsenseEnemyArchetype::Odran:\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                  Archetype == ELostsenseEnemyArchetype::Odran\n                      ? Lostsense::Combat::CombatantKind::Boss\n                      : (Archetype == ELostsenseEnemyArchetype::ForemanKett\n                             ? Lostsense::Combat::CombatantKind::Elite\n                             : Lostsense::Combat::CombatantKind::Enemy)},\n'''
          new = '''                  Archetype == ELostsenseEnemyArchetype::Odran\n                      ? Lostsense::Combat::CombatantKind::Boss\n                      : ((Archetype == ELostsenseEnemyArchetype::ForemanKett ||\n                          Archetype == ELostsenseEnemyArchetype::RailMarshal)\n                             ? Lostsense::Combat::CombatantKind::Elite\n                             : Lostsense::Combat::CombatantKind::Enemy)},\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '  bElite = InArchetype == ELostsenseEnemyArchetype::ForemanKett;\n'
          new = '''  bElite = InArchetype == ELostsenseEnemyArchetype::ForemanKett ||\n           InArchetype == ELostsenseEnemyArchetype::RailMarshal;\n'''
          assert old in s
          s = s.replace(old, new, 1)
          marker = '''  if (bBoss && BossPhase >= 2 && BossPulseCooldownRemaining <= 0.0F &&\n      AttackPatternIndex % 3 == 0) {\n'''
          pressure = '''  if (Archetype == ELostsenseEnemyArchetype::PressureMutant &&\n      AttackPatternIndex % 2 == 0) {\n    Damage.BaseDamage[static_cast<std::size_t>(\n        Lostsense::Combat::DamageType::Physical)] = 5.0;\n    Damage.BaseDamage[static_cast<std::size_t>(\n        Lostsense::Combat::DamageType::Arcane)] = 9.0;\n    Damage.AttackPowerCoefficients[static_cast<std::size_t>(\n        Lostsense::Combat::DamageType::Arcane)] = 0.45;\n  }\n\n'''
          assert marker in s
          s = s.replace(marker, pressure + marker, 1)
          p.write_text(s)

          p = Path('Source/LostsenseGame/Private/LostsenseDeepWorldSubsystem.cpp')
          s = p.read_text()
          s = s.replace('ELostsenseEnemyArchetype::ForemanKett, 9U);',
                        'ELostsenseEnemyArchetype::RailMarshal, 9U);', 1)
          s = s.replace('ELostsenseEnemyArchetype::HaulConstruct, 10U);',
                        'ELostsenseEnemyArchetype::GildedDead, 10U);', 1)
          s = s.replace('ELostsenseEnemyArchetype::EchoMiner, 10U);',
                        'ELostsenseEnemyArchetype::PressureMutant, 10U);', 1)
          s = s.replace('ELostsenseEnemyArchetype::ForemanKett, 11U);',
                        'ELostsenseEnemyArchetype::RailMarshal, 11U);', 1)
          p.write_text(s)
          PY
      - name: Format C++
        run: |
          mapfile -t files < <(find Source Tests -type f \( -name '*.cpp' -o -name '*.h' \) -print | sort)
          clang-format -i "${files[@]}"
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source
          git commit -m "Integrate Royal Deepworks enemy ecology"
          git push origin HEAD:work/deep-vaur-production
