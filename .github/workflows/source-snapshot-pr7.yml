name: PR7 source snapshot
on:
  push:
    branches:
      - codex/pr7-source-snapshot
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: lostsense-main-source
          path: |
            .clang-format
            .gitignore
            CMakeLists.txt
            README.md
            Source
            Tests
          if-no-files-found: error
          retention-days: 1
