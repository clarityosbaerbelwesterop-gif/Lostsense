name: PR15 format repair

"on":
  push:
    branches: [work/act3-crownless-reach]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/act3-crownless-reach
      - name: Format PR15 C++ surface
        run: |
          clang-format -i             Source/LostsenseGame/Public/LostsenseEnemyCharacter.h             Source/LostsenseGame/Private/LostsenseEnemyCharacter.cpp             Source/LostsenseGame/Public/LostsenseActThreeStoryActor.h             Source/LostsenseGame/Private/LostsenseActThreeStoryActor.cpp             Source/LostsenseGame/Public/LostsenseActThreeWorldSubsystem.h             Source/LostsenseGame/Private/LostsenseActThreeWorldSubsystem.cpp
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source
          git commit -m "Apply PR15 clang-format"
          git push origin HEAD:work/act3-crownless-reach
