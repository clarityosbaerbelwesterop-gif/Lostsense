name: PR9 format pass

"on":
  push:
    branches: [work/vertical-slice-world-production]

permissions:
  contents: write

jobs:
  format-verify-clean:
    if: ${{ !contains(github.event.head_commit.message, '[pr9-format-pass]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/vertical-slice-world-production
          fetch-depth: 0
      - name: Format all C++
        run: |
          mapfile -t files < <(find Source Tests -type f \( -name '*.cpp' -o -name '*.h' \) -print | sort)
          clang-format -i "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"
      - name: Unreal static filters
        run: python3 Scripts/Verify-UnrealStatic.py
      - name: GCC portable verification
        env:
          CXX: g++
        run: |
          cmake -S . -B build-pr9 -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOSTSENSE_WARNINGS_AS_ERRORS=ON
          cmake --build build-pr9 --parallel
          ctest --test-dir build-pr9 --output-on-failure
      - name: Commit formatted clean tree
        run: |
          rm -rf build-pr9
          git rm .github/workflows/pr9-format-pass.yml
          git add Source Tests Scripts CMakeLists.txt
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Format and verify PR9 production slice [pr9-format-pass]"
          git push origin HEAD:work/vertical-slice-world-production
