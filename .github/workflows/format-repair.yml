name: PR3 Format Repair

"on":
  push:
    branches: [codex/effects-ability-runtime]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/effects-ability-runtime
      - name: Apply clang-format
        run: |
          mapfile -t files < <(find Source Tests -type f \( -name '*.cpp' -o -name '*.h' \) -print | sort)
          clang-format -i "${files[@]}"
      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source Tests
          git commit -m "Format gameplay runtime"
          git push origin HEAD:codex/effects-ability-runtime
