name: PR14 format repair

"on":
  push:
    branches: [work/act2-borrowed-mother-finale]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/act2-borrowed-mother-finale
      - name: Format PR14 C++ surface
        run: |
          clang-format -i             Source/LostsenseGame/Public/LostsenseEnemyCharacter.h             Source/LostsenseGame/Private/LostsenseEnemyCharacter.cpp             Source/LostsenseGame/Public/LostsenseActTwoStoryActor.h             Source/LostsenseGame/Private/LostsenseActTwoStoryActor.cpp             Source/LostsenseGame/Private/LostsenseActTwoWorldSubsystem.cpp
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source
          git commit -m "Apply PR14 clang-format"
          git push origin HEAD:work/act2-borrowed-mother-finale
