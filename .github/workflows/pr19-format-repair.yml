name: PR19 format repair
"on":
  push:
    branches: [work/act7-second-silence]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/act7-second-silence
      - name: Format Act VII C++ surface
        run: |
          clang-format -i             Source/Lostsense/Gameplay/Story/ActSevenChoiceRuntime.h             Source/Lostsense/Gameplay/Story/ActSevenChoiceRuntime.cpp             Tests/Gameplay/ActSevenChoiceRuntimeTests.cpp             Source/LostsenseGame/Public/LostsenseStorySubsystem.h             Source/LostsenseGame/Private/LostsenseStorySubsystem.cpp             Source/LostsenseGame/Public/LostsenseEnemyCharacter.h             Source/LostsenseGame/Private/LostsenseEnemyCharacter.cpp             Source/LostsenseGame/Public/LostsenseActSevenStoryActor.h             Source/LostsenseGame/Private/LostsenseActSevenStoryActor.cpp             Source/LostsenseGame/Public/LostsenseActSevenWorldSubsystem.h             Source/LostsenseGame/Private/LostsenseActSevenWorldSubsystem.cpp
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source Tests
          git commit -m "Apply PR19 clang-format"
          git push origin HEAD:work/act7-second-silence
