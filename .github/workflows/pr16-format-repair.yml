name: PR16 format repair
"on":
  push:
    branches: [work/act4-gold-remembers]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/act4-gold-remembers
      - name: Format PR16 C++ surface
        run: |
          clang-format -i             Source/LostsenseGame/Public/LostsenseEnemyCharacter.h             Source/LostsenseGame/Private/LostsenseEnemyCharacter.cpp             Source/LostsenseGame/Private/LostsenseStorySubsystem.cpp             Source/LostsenseGame/Private/LostsenseDeepMechanismActor.cpp             Source/LostsenseGame/Public/LostsenseActFourStoryActor.h             Source/LostsenseGame/Private/LostsenseActFourStoryActor.cpp             Source/LostsenseGame/Public/LostsenseActFourWorldSubsystem.h             Source/LostsenseGame/Private/LostsenseActFourWorldSubsystem.cpp
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source
          git commit -m "Apply PR16 clang-format"
          git push origin HEAD:work/act4-gold-remembers
